<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://static.toss.im/tds/43.9.4/css/tds.min.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/main.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/others.css" />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./bundle.js"></script>
    <title>결과</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 통합 결과 화면.
      //   type: 'earn' | 'use' | 'insufficient' | 'lookup'
      //   data: type 별 필요 필드
      //   onTimeoutHref: 타이머 종료 시 이동 경로 (기본 ./home.html)
      // 컨텍스트는 ResultNavigator 로 세팅되고 여기서 소비된다.

      // 페이지 전환 시 웹소켓 서버 재시작 (결과 화면 노출 중에도 캣포스 연결 유지 필요)
      PluginBootstrap.init();

      const ctx = ResultNavigator.readContext();
      const goHome   = () => { location.href = ctx?.onTimeoutHref || './home.html'; };
      const goSearch = () => { location.href = './member-search.html'; };

      // 모든 결과 화면 공통 하단 버튼
      const HOME_BUTTON = { label: '처음으로', closeOnClick: true, onClick: goHome };

      async function render() {
        if (!ctx) {
          goHome();
          return;
        }

        const onTimeout = goHome;
        const data = ctx.data || {};
        const buttons = [HOME_BUTTON];

        switch (ctx.type) {
          case 'earn':
            return ResultPageService.showEarnSuccess({
              earnPoint:    data.earnPoint,
              storeName:    data.storeName,
              balancePoint: data.balancePoint,
              customerName: data.customerName,
              onTimeout, buttons,
            });

          case 'use':
            return ResultPageService.showUseSuccess({
              usePoint:       data.usePoint,
              storeName:      data.storeName,
              remainingPoint: data.remainingPoint,
              customerName:   data.customerName,
              onTimeout, buttons,
            });

          case 'insufficient':
            return ResultPageService.showInsufficientPoint({
              storeName:    data.storeName,
              minPoint:     data.minPoint,
              balancePoint: data.balancePoint,
              onTimeout, buttons,
            });

          case 'lookup':
            return renderLookup(data);

          default:
            console.warn('[result.html] 알 수 없는 type:', ctx.type);
            goHome();
        }
      }

      function renderLookup(data) {
        if (data.success && data.customer) {
          return ResultPageService.showLookupSuccess({
            customerName: data.customer.customerName,
            pointBalance: data.customer.pointBalance,
            onTimeout:    goHome,
            buttons:      [HOME_BUTTON],
          });
        }
        return ResultPageService.showLookupFail({
          error:     data.error,
          onTimeout: goHome,
          buttons: [
            { label: '다시 입력', closeOnClick: true, onClick: goSearch },
            HOME_BUTTON,
          ],
        });
      }

      render();
    </script>
  </body>
</html>
