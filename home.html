<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./bundle.js"></script>
    <title>Order Example - Toss Front SDK</title>
    <style>
      #app.phone-overlay-on nav { display: none !important; }
      #app.phone-overlay-on img[src*="logo-toss"] { display: none !important; }
      body > #app.phone-overlay-on { padding-top: 160px !important; padding-bottom: 160px !important; box-sizing: border-box !important; }

      .overlay-top, .overlay-bottom {
        position: fixed; left: 0; right: 0; background: #fff; z-index: 10; padding: 0 24px;
      }
      .overlay-top { top: 0; padding-top: 12px; padding-bottom: 12px; }
      .overlay-bottom { bottom: 0; padding-top: 12px; padding-bottom: 20px; }
      .overlay-hidden { display: none !important; }
      .header-back { background: none; border: 0; font-size: 24px; color: #4e5968; padding: 4px; cursor: pointer; margin-bottom: 2px; }
      .header-store { font-size: 22px; color: #8b95a1; text-align: center; margin: 0 0 8px; font-weight: 500; }
      .header-hint { font-size: 16px; color: #8b95a1; text-align: center; margin: 0; }
      .footer-agreement { display: flex; align-items: center; gap: 10px; font-size: 16px; color: #191f28; margin-bottom: 12px; justify-content: center; }
      .footer-agreement input[type='checkbox'] { width: 22px; height: 22px; accent-color: #3182f6; }
      .footer-confirm { width: 100%; height: 56px; background: #3182f6; color: #fff; border: 0; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
      .footer-confirm:disabled { background: #6b7684; cursor: not-allowed; pointer-events: none; }
    </style>
  </head>
<body>
  <div id="app"></div>

  <header class="overlay-top overlay-hidden" id="phoneOverlayTop">
    <button class="header-back" id="phoneBackBtn" aria-label="뒤로 가기">←</button>
    <p class="header-hint">휴대폰 번호 입력하고 포인트 받아가세요.</p>
  </header>

  <footer class="overlay-bottom overlay-hidden" id="phoneOverlayBottom">
    <label class="footer-agreement">
      <input type="checkbox" id="phoneAgreementCheck" checked />
      <span>[필수] 개인정보 제공 동의합니다.</span>
    </label>
    <button class="footer-confirm" id="phoneConfirmBtn" type="button">확인</button>
  </footer>
  <script>
    let _storeName = '';
    let _showStoreName = false;

    // 대기 화면 매장명 오버레이 — SDK 의 OneButtonIdlePage 에는 매장명 슬롯이 없어
    // (DefaultIdlePage 만 WallpaperBackground.Title 자동 표시) 직접 DOM 으로 추가.
    // SDK 는 #app 안에 React 트리를 그리고, #app 자체는 viewport 보다 작은 영역(태블릿 프리뷰)일 수 있으므로
    // viewport 기준 fixed 좌표가 아니라 #app 의 getBoundingClientRect 로 위치를 계산해야 함.
    function positionStoreNameOverlay() {
      const el  = document.getElementById('pharm-store-name-overlay');
      const app = document.getElementById('app');
      if (!el || !app) return;
      const r = app.getBoundingClientRect();
      // OneButtonIdlePage: FloatingButton bottom:70 + height:90 → 버튼 상단이 #app bottom 에서 ~160px 위.
      // 매장명을 버튼 상단에서 ~80px 더 위로 배치 (총 #app bottom 에서 240px).
      el.style.left  = `${r.left}px`;
      el.style.width = `${r.width}px`;
      el.style.top   = `${r.bottom - 240}px`;
    }

    function showStoreNameOverlay(name) {
      let el = document.getElementById('pharm-store-name-overlay');
      if (!el) {
        el = document.createElement('div');
        el.id = 'pharm-store-name-overlay';
        el.style.cssText = [
          'position:fixed',
          'text-align:center',
          'color:#ffffff',
          'font-size:48px',
          'font-weight:700',
          'letter-spacing:-1px',
          'pointer-events:none',   // 버튼/배경 클릭 막지 않게
          'z-index:10',
        ].join(';');
        document.body.appendChild(el);
        window.addEventListener('resize', positionStoreNameOverlay);
      }
      el.textContent = name;
      el.style.display = '';
      positionStoreNameOverlay();
    }

    function hideStoreNameOverlay() {
      const el = document.getElementById('pharm-store-name-overlay');
      if (el) el.style.display = 'none';
    }

    function showPhoneOverlay() {
      document.getElementById('phoneOverlayTop').classList.remove('overlay-hidden');
      document.getElementById('phoneOverlayBottom').classList.remove('overlay-hidden');
      document.getElementById('app').classList.add('phone-overlay-on');
    }
    function hidePhoneOverlay() {
      document.getElementById('phoneOverlayTop').classList.add('overlay-hidden');
      document.getElementById('phoneOverlayBottom').classList.add('overlay-hidden');
      document.getElementById('app').classList.remove('phone-overlay-on');
    }

    let _currentPhone = '';

    function triggerPhoneSubmit(handler) {
      const phone = _currentPhone || '';
      if (phone.length !== 11) { sdk.template.openToast({ message: '휴대폰 번호 11자리를 모두 입력해주세요.', icon: 'error' }); return; }
      if (!document.getElementById('phoneAgreementCheck').checked) {
        sdk.template.openToast({ message: '개인정보 제공 동의가 필요합니다.', icon: 'error' }); return;
      }
      handler(phone);
    }

    function renderIdle() {
      hidePhoneOverlay();
      sdk.template.renderIdlePage({
        type: 'oneButton',
        button: {
          text: '포인트 조회',
          onClick: () => { location.href = './member-search.html'; },
        },
      });
      if (_showStoreName && _storeName) showStoreNameOverlay(_storeName);
      else                              hideStoreNameOverlay();
    }


    function renderPhoneInput() {
      hideStoreNameOverlay();
      _currentPhone = '';
      showPhoneOverlay();

      const onSubmitPhone = async (phone) => {
        await SocketGateway.sendCATPhoneNumber(phone);
        renderIdle();
      };

      sdk.template.renderInputPage({
        type: 'phone',
        top: { title: '', subtitle: '' },
        input: {
          placeholder: '전화번호 입력',
          onChange: (value) => { _currentPhone = value; },
        },
        onSubmit: (phone) => { _currentPhone = phone; triggerPhoneSubmit(onSubmitPhone); },
        onBack: () => {
          hidePhoneOverlay();
          SocketGateway.sendCATFail();
          renderIdle();
        },
      });

      document.getElementById('phoneBackBtn').onclick = () => {
        hidePhoneOverlay();
        SocketGateway.sendCATFail();
        renderIdle();
      };
      document.getElementById('phoneConfirmBtn').onclick = () => triggerPhoneSubmit(onSubmitPhone);

      const agreement = document.getElementById('phoneAgreementCheck');
      const confirmBtn = document.getElementById('phoneConfirmBtn');
      const syncBtnState = () => { confirmBtn.disabled = !agreement.checked; };
      agreement.onchange = syncBtnState;
      syncBtnState();
    }

    // CUSTOMER_REGISTER_REQ (Legacy CAT|002) — 캣포스가 회원 정보 조회를 요청.
    // Android: PhoneNumberInputViewModel.sendCATCustomerInfo → GetCustomerUseCase → sendCATCustomerInfo
    function renderCustomerLookup() {
      hideStoreNameOverlay();
      hidePhoneOverlay();
      sdk.template.renderInputPage({
        type: 'phone',
        top: {
          title: '휴대폰 번호를 입력해주세요.',
          subtitle: '회원 조회',
        },
        disclaimer: '등록되지 않은 회원인 경우 신규 등록됩니다.',
        input: {
          placeholder: '전화번호 입력',
        },
        onSubmit: async (phone) => {
          const res = await PointInquiryService.getPointBalance(phone);
          if (!res.success || !res.customer) {
            // Android: ChangeLoading(false) 만 하고 후속 처리 없음 (재입력 가능 상태 유지).
            // Web 일관성을 위해 토스트로 사용자 인지 — 입력 화면은 그대로 유지.
            sdk.template.openToast({
              message: res.error || '등록된 회원이 없습니다.',
              icon:    'error',
            });
            return;
          }
          // Android: sendCATCustomerInfo(phone, customerCode) → "OK|{phone}|{customerCode}\r\n"
          // → 캣포스의 다음 명령 대기 (Android WaitingScreen ≒ Web renderIdle: AppSession 이 다음 CAT 이벤트 자동 라우팅)
          await SocketGateway.sendCATCustomerInfo(phone, res.customer.customerCode || '');
          renderIdle();
        },
        onBack: () => {
          SocketGateway.sendCATFail();
          renderIdle();
        },
      });
    }

    function startUsePointFlow(args) {
      // args = { source, transactionData: { payAmount, trnDate, ... } }
      sessionStorage.setItem('pharm_use_point_ctx', JSON.stringify({
        source:    args.source,
        payAmount: args.transactionData?.payAmount ?? 0,
        trnDate:   args.transactionData?.trnDate   ?? '',
      }));
      location.href = './point-use-flow.html';
    }

    // CAT_WITH_CUSTOMER (CAT 007) — 캣포스가 이미 고객을 선택해서 보유포인트/결제금액을 함께 보낸 사용 요청.
    // 휴대폰 입력 스킵, 잔액 검증 후 바로 사용 입력 화면으로.
    function startUseWithCustomerFlow(args) {
      sessionStorage.setItem('pharm_use_point_with_customer_ctx', JSON.stringify({
        source:            args.source,
        balance:           args.balance           ?? 0,
        payAmount:         args.payAmount         ?? 0,
        minPoint:          args.minPoint          ?? 0,
        isMinPointEnabled: args.isMinPointEnabled ?? false,
      }));
      location.href = './point-use-with-customer-flow.html';
    }

    // EARN_SINGLE_REQ / EARN_MULTI_REQ 공통 진입.
    // PointEarnService 가 transactionData.payments 유무로 SINGLE/MULTIPLE 자동 분기하므로
    // UI 측은 동일한 화면(point-earn-flow.html) 으로 라우팅한다.
    function startEarnPointFlow(args) {
      sessionStorage.setItem('pharm_earn_point_ctx', JSON.stringify({
        source:          args.source,
        paymentType:     args.paymentType,
        transactionData: args.transactionData ?? {},
      }));
      location.href = './point-earn-flow.html';
    }

    (async () => {
      // ApiConfig 초기화 (sdk.app.getMerchant로 taxNo 설정 완료까지 대기)
      await ApiConfig.ensureInit();

      AppSession.start({
        onNavigateToSavePoint:  (args) => { startEarnPointFlow(args); },
        onNavigateToLookup:     (args) => { startUsePointFlow(args); },
        onNavigateToUsePoint:   (args) => { startUseWithCustomerFlow(args); },
        onNavigateToCatRequest: (args) => {
          if      (args.mode === 'CAT_REQUEST_NUM')      renderPhoneInput();
          else if (args.mode === 'CAT_REQUEST_CUSTOMER') renderCustomerLookup();
        },
        onCatDisconnect: () => { renderIdle(); },
      });
    })();

    renderIdle();

    async function syncIdleConfig() {
      const [cfg, showStoreName, merchant] = await Promise.allSettled([
        AppConfigService.getPointUseConfig(),
        AppConfigService.getShowStoreName(),
        sdk.app.getMerchant(),
      ]);

      if (cfg.status === 'fulfilled') AppSession.setConfig(cfg.value);
      else console.warn('[home] minPoint config load fail', cfg.reason);

      _showStoreName = showStoreName.status === 'fulfilled' ? showStoreName.value : false;
      _storeName     = merchant.status === 'fulfilled' ? (merchant.value?.name ?? '') : '';

      // 토글 ON/OFF 양쪽 모두 반영되도록 항상 재렌더
      // (renderIdle 내부에서 _showStoreName/_storeName 조건으로 show/hide 분기)
      renderIdle();
    }

    syncIdleConfig();

    // "대기화면으로" 메뉴 / back 버튼은 home.html 의 전체 리로드를 일으키지 않을 수 있어
    // (호스트가 webview 컨텍스트를 살려둔 채 복귀) IIFE 가 재실행되지 않음.
    // 화면이 다시 보일 때마다 토글/매장명을 재조회해서 즉각 반영되게 함.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') syncIdleConfig();
    });
    window.addEventListener('pageshow', () => { syncIdleConfig(); });

    window.addEventListener('beforeunload', () => { AppSession.stop(); });
  </script>
</body>
</html>
