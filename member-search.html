<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://static.toss.im/tds/43.9.4/css/tds.min.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/main.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/others.css" />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./bundle.js"></script>
    <title>전화번호 입력</title>
    <style>
      /* Toss SDK 풀스크린 위의 불필요한 요소 숨김 */
      #app nav { display: none !important; }
      #app img[src*="logo-toss"] { display: none !important; }
      /* Toss 콘텐츠를 overlay 사이로 밀어넣기 */
      body > #app { padding-top: 160px !important; padding-bottom: 160px !important; box-sizing: border-box !important; }

      .overlay-top, .overlay-bottom {
        position: fixed; left: 0; right: 0; background: #fff; z-index: 10; padding: 0 24px;
      }
      .overlay-top { top: 0; padding-top: 12px; padding-bottom: 12px; }
      .overlay-bottom { bottom: 0; padding-top: 12px; padding-bottom: 20px; }
      .header-back { background: none; border: 0; font-size: 24px; color: #4e5968; padding: 4px; cursor: pointer; margin-bottom: 2px; }
      .header-store { font-size: 22px; color: #8b95a1; text-align: center; margin: 0 0 8px; font-weight: 500; }
      .header-hint { font-size: 16px; color: #8b95a1; text-align: center; margin: 0; }
      .footer-agreement { display: flex; align-items: center; gap: 10px; font-size: 16px; color: #191f28; margin-bottom: 12px; justify-content: center; }
      .footer-agreement input[type='checkbox'] { width: 22px; height: 22px; accent-color: #3182f6; }
      .footer-confirm { width: 100%; height: 56px; background: #3182f6; color: #fff; border: 0; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
      .footer-confirm:disabled { background: #6b7684; cursor: not-allowed; pointer-events: none; }
    </style>
  </head>
<body>
  <div id="app"></div>

  <header class="overlay-top">
    <button class="header-back" id="backBtn" aria-label="뒤로 가기">←</button>
    <p class="header-store" id="storeName">&nbsp;</p>
    <p class="header-hint">휴대폰 번호 입력하고 포인트 받아가세요.</p>
  </header>

  <footer class="overlay-bottom">
    <label class="footer-agreement">
      <input type="checkbox" id="agreementCheck" checked />
      <span>[필수] 개인정보 제공 동의합니다.</span>
    </label>
    <button class="footer-confirm" id="confirmBtn" type="button">확인</button>
  </footer>

  <script>
    let currentPhone = '';

    function toast(message, icon) { sdk.template.openToast({ message, icon }); }

    function triggerSubmit(handler) {
      const phone = currentPhone || '';
      if (phone.length !== 11) { toast('휴대폰 번호 11자리를 모두 입력해주세요.', 'error'); return; }
      const agreement = document.getElementById('agreementCheck');
      if (!agreement.checked) { toast('개인정보 제공 동의가 필요합니다.', 'error'); return; }
      handler(phone);
    }

    async function submitInquiry(phone) {
      try {
        const result = await PointInquiryService.getPointBalance(phone);
        sessionStorage.setItem('pharm_lookup_result', JSON.stringify({ phone, ...result }));
      } catch (err) {
        console.error('포인트 조회 실패:', err);
        sessionStorage.setItem('pharm_lookup_result', JSON.stringify({
          phone, success: false, error: `조회 중 오류가 발생했습니다. (${err.message})`,
        }));
      }
      location.href = './result.html';
    }

    async function init() {
      await ApiConfig.ensureInit();

      let storeName = '';
      try {
        const merchant = await sdk.app.getMerchant();
        storeName = merchant.name ?? '';
      } catch (e) { console.error('매장명 조회 실패:', e); }
      document.getElementById('storeName').textContent = storeName || ' ';

      sdk.template.renderInputPage({
        type: 'phone',
        top: { title: '', subtitle: '' },
        input: {
          placeholder: '전화번호 입력',
          onChange: (value) => { currentPhone = value; },
        },
        onSubmit: (phone) => { currentPhone = phone; },
        onBack: () => { location.href = './home.html'; },
      });

      document.getElementById('backBtn').addEventListener('click', () => {
        location.href = './home.html';
      });
      document.getElementById('confirmBtn').addEventListener('click', () => {
        triggerSubmit(submitInquiry);
      });

      const agreement = document.getElementById('agreementCheck');
      const confirmBtn = document.getElementById('confirmBtn');
      const syncBtnState = () => { confirmBtn.disabled = !agreement.checked; };
      agreement.addEventListener('change', syncBtnState);
      syncBtnState();
    }

    init();
  </script>
</body>
</html>
