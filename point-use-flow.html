<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://static.toss.im/tds/43.9.4/css/tds.min.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/main.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/others.css" />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./bundle.js"></script>
    <title>포인트 사용</title>
    <style>
      #app.phone-overlay-on nav { display: none !important; }
      #app.phone-overlay-on img[src*="logo-toss"] { display: none !important; }
      body > #app.phone-overlay-on { padding-top: 160px !important; padding-bottom: 160px !important; box-sizing: border-box !important; }
      /* 사용하기 버튼 비활성 (입력 < minPoint) — React 가 관리하는 버튼 스타일 override */
      #app.use-btn-disabled form button { opacity: 0.5 !important; pointer-events: none !important; cursor: not-allowed !important; }

      .overlay-top, .overlay-bottom {
        position: fixed; left: 0; right: 0; background: #fff; z-index: 10; padding: 0 24px;
      }
      .overlay-top { top: 0; padding-top: 12px; padding-bottom: 12px; }
      .overlay-bottom { bottom: 0; padding-top: 12px; padding-bottom: 20px; }
      .overlay-hidden { display: none !important; }
      .header-back { background: none; border: 0; font-size: 24px; color: #4e5968; padding: 4px; cursor: pointer; margin-bottom: 2px; }
      .header-store { font-size: 22px; color: #8b95a1; text-align: center; margin: 0 0 4px; font-weight: 500; }
      .header-amount { font-size: 32px; font-weight: 700; color: #191f28; text-align: center; margin: 0 0 10px; }
      .header-hint { font-size: 16px; color: #8b95a1; text-align: center; margin: 0; }
      .footer-agreement { display: flex; align-items: center; gap: 10px; font-size: 16px; color: #191f28; margin-bottom: 12px; justify-content: center; }
      .footer-agreement input[type='checkbox'] { width: 22px; height: 22px; accent-color: #3182f6; }
      .footer-confirm { width: 100%; height: 56px; background: #3182f6; color: #fff; border: 0; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
      .footer-confirm:disabled { background: #6b7684; cursor: not-allowed; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <header class="overlay-top overlay-hidden" id="phoneOverlayTop">
      <button class="header-back" id="backBtn" aria-label="뒤로 가기">←</button>
      <h1 class="header-amount" id="payAmount">&nbsp;</h1>
      <p class="header-hint">휴대폰 번호 입력 후 확인 버튼을 눌러주세요.</p>
    </header>

    <footer class="overlay-bottom overlay-hidden" id="phoneOverlayBottom">
      <label class="footer-agreement">
        <input type="checkbox" id="agreementCheck" checked />
        <span>[필수] 개인정보 제공 동의합니다.</span>
      </label>
      <button class="footer-confirm" id="confirmBtn" type="button">확인</button>
    </footer>

    <script>
      const CTX_KEY = 'pharm_use_point_ctx';

      function loadContext() {
        try {
          const raw = sessionStorage.getItem(CTX_KEY);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (e) { return null; }
      }

      function clearContext() {
        sessionStorage.removeItem(CTX_KEY);
      }

      async function getStoreName() {
        try {
          const merchant = await sdk.app.getMerchant();
          return merchant?.name ?? '';
        } catch (e) { return ''; }
      }

      function returnToIdle() {
        clearContext();
        location.href = './home.html';
      }

      function toast(message, icon) {
        sdk.template.openToast({ message, icon });
      }

      function showPhoneOverlay() {
        document.getElementById('phoneOverlayTop').classList.remove('overlay-hidden');
        document.getElementById('phoneOverlayBottom').classList.remove('overlay-hidden');
        document.getElementById('app').classList.add('phone-overlay-on');
      }
      function hidePhoneOverlay() {
        document.getElementById('phoneOverlayTop').classList.add('overlay-hidden');
        document.getElementById('phoneOverlayBottom').classList.add('overlay-hidden');
        document.getElementById('app').classList.remove('phone-overlay-on');
      }

      let currentPhone = '';

      function triggerSubmit(handler) {
        const phone = currentPhone || '';
        if (phone.length !== 11) { toast('휴대폰 번호 11자리를 모두 입력해주세요.', 'error'); return; }
        const agreement = document.getElementById('agreementCheck');
        if (!agreement.checked) { toast('개인정보 제공 동의가 필요합니다.', 'error'); return; }
        handler(phone);
      }

      // ── DOM input value 강제 변경 (React-controlled input 외부 제어) ──
      function setTossInputValue(value) {
        const inp = document.querySelector('#app form input');
        if (!inp) return;
        const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
        setter.call(inp, String(value));
        inp.dispatchEvent(new Event('input', { bubbles: true }));
      }

      // ── 1. 전화번호 입력 ─────────────────────────────
      async function renderPhoneStep(ctx, prefilledPhone) {
        currentPhone = prefilledPhone || '';

        const payAmount = parseInt(ctx.payAmount, 10) || 0;
        document.getElementById('payAmount').textContent = `${payAmount.toLocaleString()}원 결제`;

        showPhoneOverlay();

        const onSubmitPhone = async (phone) => {
          // 1단계: 등록 여부 확인 (GET /api/terminals/customers)
          const exist = await PointInquiryService.getCustomer(phone);
          if (!exist.success || !exist.customer) {
            toast('등록된 회원이 없습니다.', 'error');
            return;
          }
          // 2단계: 상세 조회 (GET /api/terminals/customers/code)
          const res = await PointInquiryService.getPointBalance(phone);
          if (!res.success || !res.customer) {
            toast(res.error || '등록된 회원이 없습니다.', 'error');
            return;
          }
          hidePhoneOverlay();
          await handleLookupResult({ ctx, phone, customer: res.customer });
        };

        sdk.template.renderInputPage({
          type: 'phone',
          top: { title: '', subtitle: '' },
          input: {
            placeholder: '전화번호 입력',
            onChange: (value) => {
              currentPhone = (value || '').replace(/\D/g, '');
              syncPhoneBtnState();
            },
          },
          onSubmit: (phone) => {
            // 자동 호출 안 함 - 확인 버튼만 트리거. 입력값만 저장.
            currentPhone = phone;
            syncPhoneBtnState();
          },
          onBack: () => {
            // hidePhoneOverlay() 호출 안 함 — 페이지 전환 중 오버레이 유지해서 키패드 노출 방지
            PointUseService.cancelUse({ source: ctx.source });
            returnToIdle();
          },
        });

        document.getElementById('backBtn').onclick = () => {
          PointUseService.cancelUse({ source: ctx.source });
          returnToIdle();
        };
        document.getElementById('confirmBtn').onclick = () => triggerSubmit(onSubmitPhone);

        document.getElementById('agreementCheck').onchange = syncPhoneBtnState;
        syncPhoneBtnState();

        // 이전에 입력했던 번호 복원 (사용 포인트 입력에서 ← back 누른 경우)
        if (prefilledPhone) {
          setTimeout(() => setTossInputValue(prefilledPhone), 50);
        }
      }

      function syncPhoneBtnState() {
        const agreement = document.getElementById('agreementCheck');
        const confirmBtn = document.getElementById('confirmBtn');
        if (!agreement || !confirmBtn) return;
        confirmBtn.disabled = !(agreement.checked && currentPhone.length === 11);
      }

      // ── 2. 잔액 검증 → 부족하면 결과화면, 충분하면 입력화면 ─
      async function handleLookupResult({ ctx, phone, customer }) {
        const cfg = await AppConfigService.getPointUseConfig();
        const balance = customer.pointBalance || 0;

        const insufficient =
          (cfg.isMinPointEnabled && cfg.minPoint > balance) || balance < 1;

        const storeName = await getStoreName();

        if (insufficient) {
          ResultPageService.showInsufficientPoint({
            storeName,
            minPoint:     cfg.minPoint,
            balancePoint: balance,
            onTimeout: returnToIdle,
          });
          PointUseService.cancelUse({ source: ctx.source });
          return;
        }

        renderUseInputStep({ ctx, phone, customer, balance, cfg, storeName });
      }

      // ── 3. 사용 포인트 입력 (renderInputPage 'number') ──
      let currentUseValue = 0;
      let useMinPoint = 1;

      function syncTossUseBtnState() {
        const app = document.getElementById('app');
        if (!app) return;
        const isValid = currentUseValue >= useMinPoint;
        app.classList.toggle('use-btn-disabled', !isValid);
      }

      function renderUseInputStep({ ctx, phone, customer, balance, cfg, storeName }) {
        const maxPoint = Math.min(balance, ctx.payAmount || balance);

        const disclaimer = cfg.isMinPointEnabled && cfg.minPoint > 0
          ? `포인트는 최소 ${cfg.minPoint.toLocaleString('ko-KR')}P부터 사용 가능합니다`
          : `사용 가능 포인트 ${maxPoint.toLocaleString('ko-KR')}P`;

        currentUseValue = 0;
        useMinPoint = cfg.isMinPointEnabled && cfg.minPoint > 0 ? cfg.minPoint : 1;

        sdk.template.renderInputPage({
          type: 'number',
          top: {
            title:    '사용할 포인트를 입력해주세요',
            subtitle: `${balance.toLocaleString('ko-KR')}P 보유`,
          },
          input: {
            placeholder: '포인트 입력',
            onChange: (value) => {
              let v = parseInt(String(value).replace(/[^0-9]/g, ''), 10) || 0;
              // 보유 초과 시 보유 전액으로 자동 변경 (실시간)
              if (v > maxPoint) {
                setTossInputValue(maxPoint);
                v = maxPoint;
              }
              currentUseValue = v;
              syncTossUseBtnState();
            },
          },
          button: { label: '사용하기' },
          disclaimer,
          onSubmit: async (value) => {
            const raw = parseInt(String(value).replace(/[^0-9]/g, ''), 10) || 0;

            if (cfg.isMinPointEnabled && cfg.minPoint > 0 && raw < cfg.minPoint) {
              toast(`${cfg.minPoint.toLocaleString('ko-KR')}P 이상 입력해주세요`, 'error');
              return;
            }
            if (raw <= 0) {
              toast('사용 포인트를 입력해주세요.', 'error');
              return;
            }
            const usePoint = Math.min(raw, maxPoint);

            await PointUseService.relayUseResult({
              source:       ctx.source,
              phone,
              customerCode: customer.customerCode,
              balance,
              usePoint,
            });

            ResultPageService.showUseSuccess({
              usePoint,
              storeName,
              remainingPoint: PointUseService.remainingPoint(balance, usePoint),
              onTimeout: returnToIdle,
            });
            clearContext();
          },
          onBack: () => {
            // 휴대폰 입력 단계로 복귀 (입력했던 번호 그대로)
            renderPhoneStep(ctx, phone);
          },
        });

        // Toss 가 버튼 렌더한 직후 비활성 상태 초기화
        setTimeout(syncTossUseBtnState, 0);
      }

      // ── entry ───────────────────────────────────────
      const ctx = loadContext();
      if (!ctx) {
        returnToIdle();
      } else {
        renderPhoneStep(ctx);
      }
    </script>
  </body>
</html>
