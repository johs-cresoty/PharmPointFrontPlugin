<!DOCTYPE html>
<html lang="ko">
<head>
  
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./bundle.js"></script>
    <title>플러그인 설정 (예시)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f5;
        padding: 20px;
      }
      .container {
        max-width: 480px;
        margin: 0 auto;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 24px;
        color: #1a1a1a;
      }
      .setting-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #fff;
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 12px;
      }
      .setting-label {
        font-size: 15px;
        color: #333;
      }
      .setting-value {
        font-size: 15px;
        color: #666;
      }
      select {
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        background: #fff;
        cursor: pointer;
      }
      .toggle {
        position: relative;
        width: 52px;
        height: 32px;
      }
      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: 0.3s;
        border-radius: 32px;
      }
      .toggle-slider:before {
        position: absolute;
        content: "";
        height: 26px;
        width: 26px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.3s;
        border-radius: 50%;
      }
      .toggle input:checked + .toggle-slider {
        background-color: #0064ff;
      }
      .toggle input:checked + .toggle-slider:before {
        transform: translateX(20px);
      }
      /* SDK 템플릿 미렌더 상태에서 빈 #app 가 시각 공간을 차지하는 것 방지 */
      #app:empty { display: none; }
      /* renderSelectGridPage 옵션 title 의 \n 을 실제 줄바꿈으로 렌더 */
      #app button { white-space: pre-line; }
    </style>
</head>
<body>
  <!-- SDK 템플릿 렌더 대상 (renderSelectGridPage / renderInputPage / renderResultPage 가 #app 안에 마운트됨) -->
  <div id="app"></div>
  <div class="container" id="settings-container">
    <h1>플러그인 설정 (예시)</h1>

    <!-- Toss SN -->
    <div class="setting-row">
      <span class="setting-label">Toss SN</span>
      <span class="setting-value" id="serial-number">-</span>
    </div>

    <!-- 시리얼 통신 속도 -->
    <div class="setting-row">
      <span class="setting-label">시리얼 통신 속도</span>
      <select id="baud-rate">
        <option value="115200">115200</option>
        <option value="38400">38400</option>
      </select>
    </div>

    <!-- 대기 화면에 매장명 표시 -->
    <div class="setting-row">
      <span class="setting-label">대기 화면에 매장명 표시</span>
      <label class="toggle">
        <input type="checkbox" id="show-store-name">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- 최소 사용 포인트 -->
    <div class="setting-row" id="min-point-row" style="cursor: pointer;">
      <span class="setting-label">최소 사용 포인트</span>
      <span class="setting-value" id="min-point-value">-</span>
    </div>
  </div>

  <script>
    function fmtPoint(n) {
      const num = Number.isFinite(n) ? n : parseInt(n, 10) || 0;
      return num.toLocaleString('ko-KR') + 'P';
    }

    // 초기 설정값 로드
    async function loadSettings() {
      try {
        const { serialNumber } = await sdk.app.getSerialNumber();
        document.getElementById('serial-number').textContent = serialNumber;
      } catch (e) {
        document.getElementById('serial-number').textContent = '알 수 없음';
      }

      try {
        const baudRateItem = await sdk.storage.get({ key: StorageKeys.BAUD_RATE });
        if (baudRateItem.value) {
          document.getElementById('baud-rate').value = baudRateItem.value;
        }

        const showStoreNameItem = await sdk.storage.get({ key: StorageKeys.SHOW_STORE_NAME });
        const showStoreName = showStoreNameItem.value === null ? true : showStoreNameItem.value === 'true';
        document.getElementById('show-store-name').checked = showStoreName;
      } catch (e) {
        console.error('설정 불러오기 실패:', e);
      }

      await refreshMinPointLabel();
    }

    async function refreshMinPointLabel() {
      const minPoint = await AppConfigService.getMinPoint();
      document.getElementById('min-point-value').textContent = fmtPoint(minPoint);
    }

    // 시리얼 통신 속도 변경 시 저장
    document.getElementById('baud-rate').addEventListener('change', async (e) => {
      try {
        await sdk.storage.set({ key: StorageKeys.BAUD_RATE, value: e.target.value });
      } catch (err) {
        console.error('통신 속도 저장 실패:', err);
      }
    });

    // 대기 화면 매장명 표시 토글 변경 시 저장
    document.getElementById('show-store-name').addEventListener('change', async (e) => {
      try {
        await sdk.storage.set({ key: StorageKeys.SHOW_STORE_NAME, value: String(e.target.checked) });
      } catch (err) {
        console.error('매장명 표시 설정 저장 실패:', err);
      }
    });

    // ── 최소 사용 포인트 (Grid 선택) ─────────────────
    const MIN_POINT_PRESETS = [0, 100, 500, 1000];

    async function applyMinPoint(n) {
      await AppConfigService.setMinPoint(n);
      ResultPageService.showMinPointSaved({
        minPoint: n,
        onTimeout: () => { location.href = './settings.html'; },
      });
    }

    /**
     * 그리드 옵션 빌드: 프리셋 + (프리셋에 없으면) 현재값 끼워넣기 + 직접 입력.
     * 현재값 항목 title 에 "(현재 설정)" 마킹.
     */
    function buildMinPointOptions(currentValue) {
      const presetSet = new Set(MIN_POINT_PRESETS);
      const values = [...MIN_POINT_PRESETS];
      if (Number.isFinite(currentValue) && currentValue >= 0 && !presetSet.has(currentValue)) {
        values.push(currentValue);
        values.sort((a, b) => a - b);
      }
      const presetOptions = values.map(v => ({
        id:      String(v),
        title:   v === currentValue ? `${fmtPoint(v)}\n(현재 설정)` : fmtPoint(v),
        onClick: () => applyMinPoint(v),
      }));
      return [
        ...presetOptions,
        { id: 'custom', title: '직접 입력', onClick: () => openMinPointInput() },
      ];
    }

    function hideSettingsContainer() {
      const el = document.getElementById('settings-container');
      if (el) el.style.display = 'none';
    }

    async function openMinPointGrid() {
      hideSettingsContainer();
      const current = await AppConfigService.getMinPoint();
      sdk.template.renderSelectGridPage({
        title:    '최소 사용 포인트',
        subtitle: '설정',
        options:  buildMinPointOptions(current),
        onBack:   () => { location.href = './settings.html'; },
      });
    }

    function openMinPointInput() {
      hideSettingsContainer();
      sdk.template.renderInputPage({
        type: 'number',
        top:  { title: '최소 사용 포인트', subtitle: '직접 입력' },
        input:  { placeholder: '포인트 입력' },
        button: { label: '저장' },
        disclaimer: '0P 입력 시 최소 사용 포인트 제한이 해제됩니다.',
        onSubmit: async (value) => {
          const n = Math.max(0, parseInt(value, 10) || 0);
          await applyMinPoint(n);
        },
        onBack: () => openMinPointGrid(),
      });
    }

    document.getElementById('min-point-row').addEventListener('click', openMinPointGrid);

    loadSettings();
  </script>
</body>
</html>
