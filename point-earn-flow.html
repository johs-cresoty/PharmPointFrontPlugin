<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://static.toss.im/tds/43.9.4/css/tds.min.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/main.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/others.css" />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./bundle.js"></script>
    <title>포인트 적립</title>
    <style>
      #app nav { display: none !important; }
      #app img[src*="logo-toss"] { display: none !important; }
      body > #app { padding-top: 160px !important; padding-bottom: 160px !important; box-sizing: border-box !important; }

      .overlay-top, .overlay-bottom {
        position: fixed; left: 0; right: 0; background: #fff; z-index: 10; padding: 0 24px;
      }
      .overlay-top { top: 0; padding-top: 12px; padding-bottom: 12px; }
      .overlay-bottom { bottom: 0; padding-top: 12px; padding-bottom: 20px; }
      .header-back { background: none; border: 0; font-size: 24px; color: #4e5968; padding: 4px; cursor: pointer; margin-bottom: 2px; }
      .header-store { font-size: 22px; color: #8b95a1; text-align: center; margin: 0 0 4px; font-weight: 500; }
      .header-amount { font-size: 32px; font-weight: 700; color: #191f28; text-align: center; margin: 0 0 10px; }
      .header-estimate-row { text-align: center; margin-bottom: 10px; }
      .header-estimate { display: inline-flex; align-items: center; gap: 6px; background: #e8f3ff; color: #3182f6; padding: 6px 14px; border-radius: 999px; font-size: 15px; font-weight: 700; }
      .header-estimate-icon { width: 20px; height: 20px; border-radius: 50%; background: #3182f6; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
      .header-hint { font-size: 16px; color: #8b95a1; text-align: center; margin: 0; }
      .footer-agreement { display: flex; align-items: center; gap: 10px; font-size: 16px; color: #191f28; margin-bottom: 12px; justify-content: center; }
      .footer-agreement input[type='checkbox'] { width: 22px; height: 22px; accent-color: #3182f6; }
      .footer-confirm { width: 100%; height: 56px; background: #3182f6; color: #fff; border: 0; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
      .footer-confirm:disabled { background: #6b7684; cursor: not-allowed; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <header class="overlay-top">
      <button class="header-back" id="backBtn" aria-label="뒤로 가기">←</button>
      <h1 class="header-amount" id="payAmount">&nbsp;</h1>
      <div class="header-estimate-row">
        <span class="header-estimate" id="estimateBadge">
          <span class="header-estimate-icon">₩</span>
          <span id="estimatePointText">0P 적립예상</span>
        </span>
      </div>
      <p class="header-hint">휴대폰 번호 입력 후 확인 버튼을 눌러주세요.</p>
    </header>

    <footer class="overlay-bottom">
      <label class="footer-agreement">
        <input type="checkbox" id="agreementCheck" checked />
        <span>[필수] 개인정보 제공 동의합니다.</span>
      </label>
      <button class="footer-confirm" id="confirmBtn" type="button">확인</button>
    </footer>

    <script>
      // sessionStorage 컨텍스트
      //   { source: 'CAT'|'TERMINAL', paymentType: 'SINGLE'|'MULTIPLE',
      //     transactionData: { trnDate, trnTime, appNum, trnGubn, payAmount, payments? } }
      const CTX_KEY = 'pharm_earn_point_ctx';

      function loadContext() {
        try {
          const raw = sessionStorage.getItem(CTX_KEY);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (e) { return null; }
      }

      function clearContext() {
        sessionStorage.removeItem(CTX_KEY);
      }

      async function getStoreName() {
        try {
          const merchant = await sdk.app.getMerchant();
          return merchant?.name ?? '';
        } catch (e) { return ''; }
      }

      function returnToIdle() {
        clearContext();
        location.href = './home.html';
      }

      function toast(message, icon) {
        sdk.template.openToast({ message, icon });
      }

      // 최신 입력값 추적 — Toss SDK 의 onChange 콜백이 매번 갱신
      let currentPhone = '';

      function renderTossKeypad({ onSubmitPhone, onBack }) {
        sdk.template.renderInputPage({
          type: 'phone',
          top: { title: '', subtitle: '' },
          input: {
            placeholder: '전화번호 입력',
            onChange: (value) => {
              currentPhone = (value || '').replace(/\D/g, '');
              syncConfirmBtnState();
            },
          },
          onSubmit: (phone) => {
            // 자동 호출 안 함 - 확인 버튼만 트리거. 입력값만 저장.
            currentPhone = phone;
            syncConfirmBtnState();
          },
          onBack: () => { onBack(); },
        });
      }

      function syncConfirmBtnState() {
        const agreement = document.getElementById('agreementCheck');
        const confirmBtn = document.getElementById('confirmBtn');
        if (!agreement || !confirmBtn) return;
        confirmBtn.disabled = !(agreement.checked && currentPhone.length === 11);
      }

      function triggerSubmit(handler) {
        const phone = currentPhone || '';
        if (phone.length !== 11) {
          toast('휴대폰 번호 11자리를 모두 입력해주세요.', 'error');
          return;
        }
        const agreement = document.getElementById('agreementCheck');
        if (!agreement.checked) {
          toast('개인정보 제공 동의가 필요합니다.', 'error');
          return;
        }
        handler(phone);
      }

      // ── 적립 확정 ───────────────────────────────────
      async function submitEarn({ ctx, phone, estimatePromise }) {
        const td = ctx.transactionData || {};

        let sleSeq = '';
        let estimatedPoint = 0;
        try {
          const est = await estimatePromise;
          if (est?.success && est.data) {
            sleSeq         = est.data.sleSeq || '';
            estimatedPoint = parseInt(est.data.pointAmount, 10) || 0;
          }
        } catch (e) {
          console.warn('[earn-flow] estimate failed, continuing without sleSeq', e);
        }

        const commitResult = await PointEarnService.commitWithFallback({
          customerPhone:     phone,
          transactionDate:   td.trnDate || '',
          sleSeq,
          transactionGubn:   td.trnGubn || '',
          transactionTime:   td.trnTime || '',
          transactionAmount: td.payAmount || 0,
          approvalNumber:    td.appNum || '',
          payments:          td.payments,
        });

        if (!commitResult.success) {
          toast(commitResult.error || '적립 실패', 'error');
          return;
        }

        const balancePoint = parseInt(commitResult.data?.pointBalance, 10) || 0;
        const earnPoint = estimatedPoint || (parseInt(commitResult.data?.pointAmount, 10) || 0);
        const storeName = await getStoreName();

        ResultPageService.showEarnSuccess({
          earnPoint,
          storeName,
          balancePoint,
          onTimeout: returnToIdle,
        });
        clearContext();
      }

      // ── entry ───────────────────────────────────────
      async function init() {
        await ApiConfig.ensureInit();
        const ctx = loadContext();
        if (!ctx) {
          returnToIdle();
          return;
        }

        // 헤더 결제금액 채우기
        const payAmount = parseInt(ctx.transactionData?.payAmount, 10) || 0;
        document.getElementById('payAmount').textContent =
          `${payAmount.toLocaleString()}원 결제`;

        // estimate 병렬 시작
        const estimatePromise = PointEarnService.estimate(ctx.transactionData || {})
          .catch(e => { console.warn('[earn-flow] estimate error', e); return { success: false }; });

        // 적립예상 P 가 잡히면 뱃지 업데이트
        estimatePromise.then((est) => {
          if (est?.success && est.data) {
            const p = parseInt(est.data.pointAmount, 10) || 0;
            document.getElementById('estimatePointText').textContent =
              `${p.toLocaleString()}P 적립예상`;
          }
        });

        // 키패드 + 입력칸 (토스 SDK)
        renderTossKeypad({
          onSubmitPhone: (phone) => submitEarn({ ctx, phone, estimatePromise }),
          onBack: () => {
            PointEarnService.cancelEarn({ source: ctx.source });
            returnToIdle();
          },
        });

        // 커스텀 컨트롤 바인딩
        document.getElementById('backBtn').addEventListener('click', () => {
          PointEarnService.cancelEarn({ source: ctx.source });
          returnToIdle();
        });
        document.getElementById('confirmBtn').addEventListener('click', () => {
          triggerSubmit((phone) => submitEarn({ ctx, phone, estimatePromise }));
        });

        document.getElementById('agreementCheck').addEventListener('change', syncConfirmBtnState);
        syncConfirmBtnState();
      }

      init();
    </script>
  </body>
</html>
